<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>Waseda Moodle Plus</title>
        <link rel="stylesheet" href="../styles/components.css" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body class="wmp-scope">
        <header class="pp-header">
            <img src="../icons/icon-48.png" alt="" width="22" height="22" />
            <h1>課題一覧</h1>
            <button class="wmp-icon-btn" id="refresh" title="最新の情報に更新" aria-label="更新">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <a class="wmp-icon-btn" id="open-moodle" href="https://wsdmoodle.waseda.jp/my/" target="_blank" title="Waseda Moodle を開く" aria-label="Moodle を開く">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9.5V20h14V9.5"/></svg>
            </a>
            <button class="wmp-icon-btn" id="open-settings" title="設定" aria-label="設定">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
        </header>
        <a class="pp-update" id="update-notice" target="_blank" hidden></a>
        <div class="pp-toolbar">
            <input class="wmp-input" id="search" type="search" placeholder="課題名・科目名で絞り込み" />
            <div class="wmp-segmented" id="kind-filter" role="tablist">
                <button class="is-active" data-kind="">すべて</button>
                <button data-kind="assign">課題</button>
                <button data-kind="quiz">小テスト</button>
                <button data-kind="other">その他</button>
            </div>
        </div>
        <main class="pp-body" id="body">
            <div class="pp-loading"><div class="wmp-spinner"></div></div>
        </main>
        <footer class="pp-footer">
            <span class="wmp-muted" id="updated"></span>
            <span class="pp-links">
                <a href="#" data-launch="my_waseda">MyWaseda</a>
                <a href="https://www.wsl.waseda.jp/syllabus/JAA101.php" target="_blank">シラバス</a>
            </span>
        </footer>
        <script src="../lib/defaults.js"></script>
        <script src="../lib/util.js"></script>
        <script src="../lib/timeline-view.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
